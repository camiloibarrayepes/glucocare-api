name: CI Pipeline

# Disparadores: se ejecuta en cada push o pull request (requisito B)///
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
      # 1. Checkout del código
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      # 2. Configurar Node.js con caché de dependencias
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      # 3. Instalación de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Análisis estático (opcional en la rúbrica, suma puntos)
      - name: Linter (análisis estático)
        run:  npm run lint

      # 5. Ejecución de pruebas con cobertura
      - name: Ejecutar pruebas con cobertura
        run: npm test -- --coverage

      # 6. Publicación del reporte
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage
          path: coverage/
          retention-days: 7