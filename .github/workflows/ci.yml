name: CI Pipeline

# Disparadores: se ejecuta en cada push o pull request (requisito B)///
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
      # 1. Checkout del código
      - name: Checkout del repositorio
        uses: actions/checkout@v5

      # 2. Configurar Node.js con caché de dependencias
      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      # 3. Instalación de dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Análisis estático (opcional en la rúbrica, suma puntos)
      - name: Linter (análisis estático)
        run:  npm run lint

      # 5. Ejecución de pruebas
      - name: Ejecutar pruebas
        run: npm test -- --coverage
      
      # 6. Organizar reporte de cobertura
      - name: Organizar reporte
        if: always()
        run: |
          REPORT_DATE=$(date -u +'%Y-%m-%d_%H-%M-%S')
          mkdir -p reports/$REPORT_DATE
          if [ -d coverage ]; then
            cp -r coverage reports/$REPORT_DATE/
          fi

      # 7. Publicación del reporte
      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-coverage-${{ github.run_id }}
          path: reports/
          retention-days: 7